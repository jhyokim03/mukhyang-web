<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>자기계발동아리 | 묵향</title>
  <link rel="stylesheet" href="style.css">
  <!-- 구글 폰트 (나눔명조/선택사항) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- 배경 오버레이 레이어 -->
  <div class="bg-overlay"></div>

  <!-- 메인 히어로 섹션 (배경 이미지가 들어가는 곳) -->
  <header class="hero">
    <div class="hero-content">
      <h1 class="title">묵 향</h1>
      <p class="subtitle">먹처럼 깊게, 향기처럼 은은하게 성장하는 자기계발 동아리</p>
      <a href="#about" class="btn">동아리 소개</a>
    </div>
  </header>

  <!-- 메인 콘텐츠 영역 -->
  <main class="container">
    <!-- 동아리 소개 섹션 -->
    <section id="about" class="section">
      <h2>동아리 소개</h2>
      <p>묵향은 각자의 목표를 공유하고 성장하는 자기계발 공간입니다.</p>
    </section>

    <!-- 사진 갤러리 섹션 -->
    <section class="section">
      <h2>활동 갤러리</h2>
      <div class="gallery-grid">
        <!-- 예시 이미지 카드들 (추후 실제 이미지로 변경) -->
        <div class="card">
          <img src="https://picsum.photos/400/300?random=1" alt="활동 사진 1">
          <p>정기 모임 & 스터디</p>
        </div>
        <div class="card">
          <img src="https://picsum.photos/400/300?random=2" alt="활동 사진 2">
          <p>목표 달성 프로젝트</p>
        </div>
        <div class="card">
          <img src="https://picsum.photos/400/300?random=3" alt="활동 사진 3">
          <p>네트워킹</p>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 묵향 (Mukhyang). All rights reserved.</p>
  </footer>

</body>
</html>
